name: Self-host editorial photography (one-time)
on:
  push:
    branches:
      - fix/v12-unique-self-hosted-media
permissions:
  contents: write
jobs:
  fetch-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Prepare image conversion
        run: |
          python3 -m venv /tmp/eai-media-env
          /tmp/eai-media-env/bin/pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Download and validate distinct licensed photographs
        run: /tmp/eai-media-env/bin/python scripts/fetch_editorial_photos.py
      - name: Commit first-party static assets to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/assets/photography/
          if ! git diff --cached --quiet; then
            git commit -m "assets: self-host nine original licensed editorial photographs"
            git push origin HEAD:fix/v12-unique-self-hosted-media
          fi
